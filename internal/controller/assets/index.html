    nameInput.addEventListener('input', function () { v.name = nameInput.value.trim(); v.nameDirty = true; });

    /* --- 匹配模式（原生 radio，天然支持方向键） --- */
    var seg = h('div', { class: 'seg', role: 'radiogroup', 'aria-label': '匹配模式' });
    [['workload', '按工作负载名'], ['labels', '按标签选择器']].forEach(function (pair) {
      var input = h('input', { type: 'radio', name: 'matchmode', value: pair[0], checked: v.matchMode === pair[0] });
      if (pair[0] === v.matchMode) input.checked = true;
      input.addEventListener('change', function () {
        if (!input.checked) return;
        v.matchMode = pair[0];
        v.nameDirty = false;   // 切换匹配模式后重新按新规则生成名称
        refreshMatch();
        suggestName();
      });
      seg.appendChild(h('label', { class: 'seg-item' }, input, h('span', { text: pair[1] })));
    });

    /* --- 动态区域 --- */
    var nsWrap = h('div', { class: 'field' });
    var matchWrap = h('div', { class: 'field' });
    var matchErr = h('p', { class: 'field-err', hidden: true, id: 'match-err' });
    var nsErr = h('p', { class: 'field-err', hidden: true, id: 'ns-err' });

    function showErr(node, text) {
      if (text) { node.textContent = T(text); node.hidden = false; } else { node.textContent = ''; node.hidden = true; }
    }

    function refreshNs() {
      clear(nsWrap);
      nsWrap.appendChild(h('label', { class: 'field-label', text: '命名空间', for: 'f-ns' }));
      var c = ui.cluster.ns;
      if (c.status === 'ok') {
        var sel = hSelect({ cls: 'mono', id: 'f-ns', fk: 'f-ns' });
        sel.appendChild(h('option', { value: '', text: '选择命名空间' }));
        c.items.forEach(function (ns) {
          var opt = h('option', { value: ns, text: ns });
          if (ns === v.ns) opt.selected = true;
          sel.appendChild(opt);
        });
        sel.addEventListener('change', function () {
          v.ns = sel.value;
          refreshMatch();
          suggestName();
        });
        nsWrap.appendChild(sel);
      } else if (c.status === 'loading' || c.status === 'idle') {
        nsWrap.appendChild(h('p', { class: 'field-hint', text: '正在读取集群命名空间…' }));
      } else {
        v.clusterDown = true;
        var inp = h('input', { class: 'input mono', type: 'text', id: 'f-ns', 'data-fk': 'f-ns', value: v.ns, placeholder: 'default', autocomplete: 'off', spellcheck: 'false' });
        inp.addEventListener('input', function () { v.ns = inp.value.trim(); refreshMatch(); suggestName(); });
        nsWrap.appendChild(inp);
        nsWrap.appendChild(h('p', { class: 'field-hint', text: '控制器未连接 apiserver，已切换为手动输入' + (c.error ? '（' + c.error + '）' : '') }));
      }
      nsWrap.appendChild(nsErr);
    }

    function degradedWorkload(label) {
      var kindSel = hSelect({ cls: 'mono', id: 'f-kind', fk: 'f-kind' });
      ['Deployment', 'StatefulSet', 'DaemonSet'].forEach(function (k) {
        var opt = h('option', { value: k, text: k });
        if (k === v.kind) opt.selected = true;
        kindSel.appendChild(opt);
      });
      kindSel.addEventListener('change', function () { v.kind = kindSel.value; suggestName(); });
      var nameInp = h('input', { class: 'input mono', type: 'text', id: 'f-wlname', 'data-fk': 'f-wlname', value: v.wlName, placeholder: 'nginx', autocomplete: 'off', spellcheck: 'false' });
      nameInp.addEventListener('input', function () { v.wlName = nameInp.value.trim(); suggestName(); });
      var row = h('div', { class: 'field-row' },
        h('div', { class: 'field' }, h('label', { class: 'field-label', text: '工作负载类型', for: 'f-kind' }), kindSel),
        h('div', { class: 'field' }, h('label', { class: 'field-label', text: '工作负载名称', for: 'f-wlname' }), nameInp));
      matchWrap.appendChild(row);
      if (label) matchWrap.appendChild(h('p', { class: 'field-hint', text: label }));
    }

    function refreshMatch() {
      clear(matchWrap);
      if (v.matchMode === 'workload') {
        matchWrap.appendChild(h('span', { class: 'field-label', text: '工作负载' }));
        var c = ui.cluster.ns;
        var w = ui.cluster.wl;
        var canPick = c.status === 'ok' && v.ns && c.items.indexOf(v.ns) >= 0;
        var nsUsable = c.status === 'ok' && v.ns && c.items.indexOf(v.ns) >= 0;
        var wlReady = nsUsable && w.status === 'ok' && w.ns === v.ns;
        if (c.status !== 'ok' || (v.ns && !nsUsable)) {
          // 集群接口不可用，或命名空间不在集群列表里：退回「类型 + 名称」手填
          degradedWorkload(c.status !== 'ok'
            ? '控制器未连接 apiserver，已切换为手动输入'
            : '命名空间 ' + v.ns + ' 不在集群列表里，已切换为手动输入');
        } else {
          // 下拉常驻：没选命名空间 / 正在读取时只置灰，
          // 这样切换命名空间不会「先消失再出现」，弹窗不会闪
          if (!wlReady && w.status !== 'error' && (w.status !== 'loading' || w.ns !== v.ns)) {
            loadWorkloads(v.ns).then(function () { if (document.contains(matchWrap)) refreshMatch(); });
          }
          var sel = hSelect({ cls: 'mono', id: 'f-wl', fk: 'f-wl', disabled: !wlReady });
          if (!v.ns) {
            sel.appendChild(h('option', { value: '', text: '先选择命名空间' }));
          } else if (!wlReady) {
            sel.appendChild(h('option', { value: '', text: w.status === 'error' ? '读取工作负载失败' : '正在读取工作负载…' }));
          } else {
            sel.appendChild(h('option', { value: '', text: '选择工作负载' }));
            w.items.forEach(function (it) {
              var opt = h('option', { value: it.kind + '/' + it.name, text: it.kind + '/' + it.name + (it.ready ? ' · ' + it.ready : '') });
              if (it.kind === v.kind && it.name === v.wlName) opt.selected = true;
              sel.appendChild(opt);
            });
          }
          sel.addEventListener('change', function () {
            var parts = sel.value.split('/');
            v.kind = parts[0] || 'Deployment';
            v.wlName = parts[1] || '';
            suggestName();
          });
          matchWrap.appendChild(sel);
          matchWrap.appendChild(h('p', {
            class: 'field-hint',
            text: !v.ns
              ? '选定命名空间后，这里会列出该命名空间下的 Deployment / StatefulSet / DaemonSet'
              : (w.status === 'error'
                ? '读取工作负载失败：' + (w.error || '未知原因')
                : (!wlReady ? '正在读取命名空间 ' + v.ns + ' 的工作负载…' : '选中后控制器会按该工作负载的 label selector 解析命中的 Pod'))
          }));
        }
      } else {
        matchWrap.appendChild(h('span', { class: 'field-label', text: '标签选择器', for: 'f-labels' }));
        var labInput = h('input', { class: 'input mono', type: 'text', id: 'f-labels', 'data-fk': 'f-labels', value: v.labels, placeholder: 'app=nginx,tier=web', autocomplete: 'off', spellcheck: 'false' });
        labInput.addEventListener('input', function () { v.labels = labInput.value; suggestName(); });
        matchWrap.appendChild(labInput);
        matchWrap.appendChild(h('p', { class: 'field-hint', text: '用逗号分隔的 k=v 列表，Pod 需同时满足全部标签；留空等于匹配所选命名空间下全部 Pod' }));
      }
      matchWrap.appendChild(matchErr);
    }

    function suggestName() {
      if (v.nameDirty) return;
      var tail = '';
      if (v.matchMode === 'workload') {
        tail = v.wlName ? (v.kind === 'Deployment' ? v.wlName : v.kind.toLowerCase() + '-' + v.wlName) : '';
      } else {
        var labels = parseLabels(v.labels);
        var keys = Object.keys(labels);
        if (keys.length) {
          var k = keys[0];
          tail = labels[k] ? k + '-' + labels[k] : k;
        }
      }
      var suggestion = slug((v.ns ? v.ns + '-' : '') + tail);
      nameInput.value = suggestion;
      v.name = suggestion;
    }

    function validate() {
      var errs = {};
      if (!PAYLOAD_NAME_RE.test(v.name)) errs.name = '名称需匹配 ^[a-z0-9][a-z0-9-]{0,30}$：小写字母、数字、连字符，1–31 个字符';
      else if (takenNames.indexOf(v.name) >= 0) errs.name = '已有同名负载 ' + v.name + '，请换一个名称';
      if (!v.ns) errs.ns = '请选择或填写命名空间';
      else if (v.ns.length > 63 || !NS_RE.test(v.ns)) errs.ns = '命名空间名不合法';
      if (v.matchMode === 'workload') {
        if (!v.kind) errs.match = '请选择工作负载类型';
        else if (!v.wlName) errs.match = '请选择或填写工作负载名称';
        else if (!/^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$/.test(v.wlName)) errs.match = '工作负载名称不合法';
      } else {
        var labels = parseLabels(v.labels);
        var labelKeys = Object.keys(labels);
        var badKey = labelKeys.filter(function (k) { return !LABEL_RE.test(k) || k.length > 63; })[0];
        var badVal = labelKeys.filter(function (k) { return labels[k] && (!LABEL_RE.test(labels[k]) || labels[k].length > 63); })[0];
        if (!labelKeys.length) errs.match = '请填写至少一个标签选择器，例如 app=nginx';
        else if (badKey) errs.match = '标签键不合法：' + badKey;
        else if (badVal) errs.match = '标签值不合法：' + labels[badVal];
      }
      showErr(nameErr, errs.name);
      showErr(nsErr, errs.ns);
      showErr(matchErr, errs.match);
      nameInput.setAttribute('aria-invalid', errs.name ? 'true' : 'false');
      return errs;
    }

    function submit() {
      var errs = validate();
      var keys = Object.keys(errs);
      if (keys.length) {
        toast('err', '表单还有 ' + keys.length + ' 处需要修正');
        if (errs.name) nameInput.focus();
        else if (errs.ns) { var nsNode = nsWrap.querySelector('input, select'); if (nsNode) nsNode.focus(); }
        else { var mNode = matchWrap.querySelector('input, select'); if (mNode) mNode.focus(); }
        return;
      }
      var matchLabels = v.matchMode === 'labels' ? parseLabels(v.labels) : {};
      var payload = {
        name: v.name,
        namespaces: [v.ns],
        workload: v.matchMode === 'workload' ? { kind: v.kind, name: v.wlName } : null,
        matchLabels: matchLabels
      };
      var newPayloads, newGrants;
      if (editing) {
        newPayloads = d.payloads.map(function (p) { return p.name === editing.name ? payload : p; });
        newGrants = d.grants.map(function (g) { return g.payload === editing.name ? { payload: payload.name, target: g.target } : g; });
      } else {
        newPayloads = d.payloads.concat([payload]);
        newGrants = d.grants.slice();
      }
      saveBtn.disabled = true;
      applyPolicy({ payloads: newPayloads, targets: d.targets, grants: newGrants },
        editing ? ('已更新负载 ' + payload.name) : ('已添加负载 ' + payload.name)).then(function () {
          ui.selectedPayload = payload.name;
          renderAll();
        }).catch(function () {
          saveBtn.disabled = false;
        });
    }

    var body = [
      h('div', { class: 'field' },
        h('label', { class: 'field-label', text: '匹配模式' }),
        seg,
        h('p', { class: 'field-hint', text: '按工作负载名：按 metadata.name 选中该命名空间下的一个 Deployment / StatefulSet / DaemonSet，控制器再用它的 label selector 匹配 Pod；按标签选择器：完全由你手写的 k=v 决定' })),
      nsWrap,
      matchWrap,
      h('div', { class: 'field' },
        h('label', { class: 'field-label', text: '负载名称', for: 'f-name' }),
        nameInput,
        nameErr,
        h('p', { class: 'field-hint', text: '策略里引用这个名称，需全局唯一；默认按「命名空间-工作负载」生成，可自行修改' }))
    ];

    nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });

    var saveBtn = btn(editing ? '保存修改' : '添加负载', { variant: 'primary', onClick: submit });

    openModal({
      title: editing ? '编辑负载' : '添加负载',
      subtitle: '负载 = 四元组的第一元，用命名空间 + 工作负载名或标签圈定一组 Pod',
      body: body,
      footer: [btn('取消', { onClick: function () { closeModal(); } }), saveBtn],
      initialFocus: nameInput
    });

    refreshNs();
    refreshMatch();
    if (!v.nameDirty && !v.name) suggestName();

    // 打开即向控制器确认集群可用性：502/503 或网络故障要能真正降级为手动输入
    loadNamespaces(false).then(function () {
      if (!document.contains(nsWrap)) return;
      refreshNs();
      refreshMatch();
      if (!v.nameDirty && !v.name) suggestName();
    });
  }

  /* ------------------------------------------------------------------ *
   * 弹窗：删除确认                                                      *
   * ------------------------------------------------------------------ */
  function confirmDeleteTarget(t) {
    var key = targetKey(t);
    var refs = refCount(key);
    var payloadsAffected = (store.data ? store.data.grants : []).filter(function (g) { return g.target === key; }).map(function (g) { return g.payload; });
    var body = [
      h('p', { class: 'modal-lead', text: '删除外部服务 ' + key + '？' }),
      h('dl', { class: 'kv' },
        h('dt', { text: '代理端口' }), h('dd', { class: 'mono', text: String(t.proxyPort) + '（删除后释放）' }),
        h('dt', { text: '受影响授权' }), h('dd', { text: refs ? refs + ' 条：' + payloadsAffected.join('、') : '没有负载引用这个目标' }))
    ];
    if (refs) {
      body.push(h('div', { class: 'modal-warn' }, icon('alert', 15),
        h('span', { text: '这 ' + refs + ' 个负载会立刻失去对 ' + key + ' 的访问授权：enforce 模式下它们的访问会被直接拒绝' })));
    }
    var delBtn = btn('确认删除', { variant: 'danger', onClick: function () {
      delBtn.disabled = true;
      var d = store.data;
      var newTargets = d.targets.filter(function (x) { return targetKey(x) !== key; });
      var newGrants = d.grants.filter(function (g) { return g.target !== key; });
      applyPolicy({ payloads: d.payloads, targets: newTargets, grants: newGrants }, '已删除 ' + key + '，代理端口 ' + t.proxyPort + ' 已释放')
        .catch(function () { delBtn.disabled = false; });
    } });
    openModal({
      title: '删除外部服务',
      subtitle: '目标一旦删除，节点上的对应规则也会随之回收',
      body: body,
      footer: [btn('取消', { onClick: function () { closeModal(); } }), delBtn]
    });
  }

  function confirmDeletePayload(p) {
    var granted = grantsOf(p.name).map(function (g) { return g.target; });
    var members = membersOf(p.name);
    var body = [
      h('p', { class: 'modal-lead' }, h('span', { class: 'mono', text: p.name }), document.createTextNode(T(' 是当前选中的负载，确认删除？'))),
      h('dl', { class: 'kv' },
        h('dt', { text: '匹配' }), h('dd', { text: payloadSummary(p) }),
        h('dt', { text: '命中 Pod' }), h('dd', { class: 'mono', text: String(members.length) + ' 个' }),
        h('dt', { text: '将撤销的授权' }), h('dd', { text: granted.length ? granted.length + ' 条：' + granted.join('、') : '没有授权' }))
    ];
    if (granted.length) {
      body.push(h('div', { class: 'modal-warn' }, icon('alert', 15),
        h('span', { text: '删除后这些 Pod 对 ' + granted.join('、') + ' 的访问授权会一并撤销；enforce 模式下会被直接拒绝；外部服务本身不会被删除' })));
    }
    var delBtn = btn('确认删除', { variant: 'danger', onClick: function () {
      delBtn.disabled = true;
      var d = store.data;
      var newPayloads = d.payloads.filter(function (x) { return x.name !== p.name; });
      var newGrants = d.grants.filter(function (g) { return g.payload !== p.name; });
      applyPolicy({ payloads: newPayloads, targets: d.targets, grants: newGrants }, '已删除负载 ' + p.name)
        .then(function () {
          if (ui.selectedPayload === p.name) ui.selectedPayload = null;
          renderAll();
        })
        .catch(function () { delBtn.disabled = false; });
    } });
    openModal({
      title: '删除负载',
      subtitle: '只删除负载定义，Pod 与外部服务都不受影响',
      body: body,
      footer: [btn('取消', { onClick: function () { closeModal(); } }), delBtn]
    });
  }

  /* ------------------------------------------------------------------ *
   * 健康探测                                                            *
   * ------------------------------------------------------------------ */
  function probeHealth(trigger) {
    if (trigger) trigger.disabled = true;
    request('/healthz').then(function (res) {
      var gen = num(res && res.generation, 0);
      ui.health = {
        ok: str(res && res.status) === 'ok',
        message: '，gen ' + gen + (res && res.store ? '，存储 ' + str(res.store) : '') + (res && res.mode ? '，模式 ' + str(res.mode) : ''),
        at: Date.now()
      };
      renderAll();
      renderStatusViewRefresh();
    }).catch(function (e) {
      ui.health = { ok: false, message: '：' + (e.message || '探测失败'), at: Date.now() };
      handleActionError(e);
      renderAll();
      renderStatusViewRefresh();
    }).then(function () {
      if (trigger && document.contains(trigger)) trigger.disabled = false;
    });
  }

  function renderStatusViewRefresh() {
    if (ui.tab !== 'status') return;
    var sec = document.getElementById('view-status');
    if (!sec || !store.data) return;
    clear(sec);
    renderStatusView(sec, false);
  }

  /* ------------------------------------------------------------------ *
   * 启动                                                                *
   * ------------------------------------------------------------------ */
  function init() {
    applyStaticI18n();
    renderStaticButtons();
    renderModes();
    renderModeHint();
    renderTabs();
    renderView();
    /* 系统主题变化时（auto 态）同步图标与提示 */
    window.__EGP_ON_SYS_THEME = function () { renderThemeButton(); };

    // 记录最近一次点击的控件：程序化触发与键盘触发都能把焦点还回去
    document.addEventListener('click', function (e) {
      var t = e.target && e.target.closest ? e.target.closest('button, a, input, select, [data-fk]') : null;
      if (t) ui.lastTrigger = t;
    }, true);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { stopPoll(); }
      else { refresh({ silent: true }); }
    });
    window.addEventListener('online', function () { refresh({ silent: true }); });
    window.addEventListener('focus', function () {
      if (store.lastOkAt && Date.now() - store.lastOkAt > POLL_MS * 2) refresh({ silent: true });
    });

    ageTimer = setInterval(tickClock, 1000);
    tickClock();
    refresh();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
