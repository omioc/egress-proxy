<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title data-i18n="出网代理 · 四元组流量管控">出网代理 · 四元组流量管控</title>
<link rel="icon" href="data:,">
<script>
// 主题与语言都必须在首帧前落地：既避免深浅色切换时的白闪，也避免中文先闪一下再切成英文
(function () {
  var root = document.documentElement;
  var params = null;
  try { params = new URLSearchParams(window.location.search); } catch (e) { params = null; }
  function param(name) { return params ? params.get(name) : null; }

  /* ---- 主题：auto（默认，跟随系统）/ light / dark ---- */
  var pref = null;
  try { pref = localStorage.getItem('egp_theme'); } catch (e) { pref = null; }
  var qTheme = param('theme');
  if (qTheme === 'auto' || qTheme === 'light' || qTheme === 'dark') pref = qTheme;
  if (pref !== 'light' && pref !== 'dark') pref = 'auto';
  try { localStorage.setItem('egp_theme', pref); } catch (e) { /* 忽略隐私模式 */ }
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function applyPref() {
    var dark = pref === 'dark' || (pref === 'auto' && !!(mq && mq.matches));
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    root.setAttribute('data-theme-pref', pref);
  }
  applyPref();
  window.__EGP_THEME_PREF = pref;
  if (mq) {
    var onSys = function () {
      if (pref !== 'auto') return;
      applyPref();
      if (typeof window.__EGP_ON_SYS_THEME === 'function') window.__EGP_ON_SYS_THEME();
    };
    if (mq.addEventListener) mq.addEventListener('change', onSys);
    else if (mq.addListener) mq.addListener(onSys);
  }

  /* ---- 语言：zh（默认）/ en；首次访问按系统语言自动选择 ---- */
  var lang = null;
  try { lang = localStorage.getItem('egp_lang'); } catch (e) { lang = null; }
  var qLang = param('lang');
  if (qLang === 'zh' || qLang === 'en') lang = qLang;
  if (lang !== 'zh' && lang !== 'en') {
    var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
    lang = 'en';
    for (var i = 0; i < list.length; i++) {
      var tag = String(list[i] || '').toLowerCase();
      if (!tag) continue;
      lang = tag.indexOf('zh') === 0 ? 'zh' : 'en';
      break;
    }
  }
  try { localStorage.setItem('egp_lang', lang); } catch (e) { /* 忽略 */ }
  root.setAttribute('lang', lang === 'en' ? 'en' : 'zh-CN');
  window.__EGP_LANG = lang;
})();
</script>
<style>
/* ============================================================================
   设计契约 · 出网代理控制台
   ----------------------------------------------------------------------------
   使命：内网机房里敲 kubectl 的 SRE，要在几秒内看清「哪个负载能访问哪个外部
         服务（走哪个代理端口）」，并能安全地增删授权、确认每台节点已同步
   颜色：浅色=灰白底 #f4f5f7 + 纯白卡片 + 1px 低对比边框 + 单一蓝色强调 #3b6cf5；
         深色=近黑底 #14161a + 卡片 #1b1e24，同一套蓝色语义
         语义色只用于状态且永远配文字：enforce=橙红 / observe=琥珀 /
         disabled=中性灰 / 成功=绿 / 未授权与危险=红；颜色从不单独承载信息
   排版：正文 13.5px/1.5，辅助 12px，微文字 11.5px；无 ALL-CAPS eyebrow，
         标题里不给单词换色；host / IP / 端口 / generation / 规则一律等宽 +
         tabular-nums，保证纵向对齐
   间距：4px 栅格（4/8/12/16/24/32）
   圆角：8px 控件 / 12px 中块 / 16px 卡片与弹窗 / 999px 胶囊
   动效：只承载状态变化；hover/press 立即反馈（120ms），列表入场 260ms 轻微
         上浮 + 60ms 递进，状态切换 180ms；全部尊重 prefers-reduced-motion
   Do：焦点 2px 环、开关是真实 checkbox、空态给下一步动作、错误文案 pre-wrap 原文
   Don't：渐变按钮、卡片套卡片、emoji 图标、transition: all、装饰性动画、
          顶部闪烁加载条
   ========================================================================== */

:root {
  color-scheme: light;
  --bg: #f4f5f7;
  --card: #ffffff;
  --stripe: #f2f4f8;
  --thead: #eef0f4;
  --card-soft: #fafbfd;
  --inset: #eef0f4;
  --line: #e5e8ee;
  --line-strong: #d3d8e2;
  --fg: #16181d;
  --fg-dim: #525a68;
  --fg-mute: #696f7a;
  --accent: #3b6cf5;
  --accent-text: #2f57c9;
  --accent-strong: #2f59d0;
  --accent-soft: rgba(59, 108, 245, .10);
  --accent-line: rgba(59, 108, 245, .32);
  --ok: #137349;
  --warn: #825b0a;
  --ok-soft: rgba(23, 143, 91, .10);
  --ok-line: rgba(23, 143, 91, .30);
  --warn-soft: rgba(196, 138, 16, .14);
  --warn-line: rgba(196, 138, 16, .38);
  --danger: #bb3136;
  --danger-soft: rgba(201, 53, 58, .10);
  --danger-line: rgba(201, 53, 58, .30);
  --enforce: #ae3e24;
  --enforce-soft: rgba(201, 72, 42, .10);
  --enforce-line: rgba(201, 72, 42, .30);
  --neutral: #6b7383;
  --neutral-soft: rgba(107, 115, 131, .12);
  --focus: #3b6cf5;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-pill: 999px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --ease: cubic-bezier(.2, .7, .3, 1);
  --ease-spring: cubic-bezier(.2, 1.05, .35, 1);
  --t-fast: 120ms;
  --t-base: 180ms;
}

html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14161a;
  --card: #1b1e24;
  --stripe: #21252c;
  --thead: #262b34;
  --card-soft: #20242b;
  --inset: #23272f;
  --line: #2a2f38;
  --line-strong: #3a414d;
  --fg: #e9ecf2;
  --fg-dim: #a7aebc;
  --fg-mute: #7e8797;
  --accent: #6d95ff;
  --accent-strong: #89a9ff;
  --accent-text: #719aff;
  --accent-soft: rgba(109, 149, 255, .16);
  --accent-line: rgba(109, 149, 255, .40);
  --ok: #3ecf92;
  --ok-soft: rgba(62, 207, 146, .14);
  --ok-line: rgba(62, 207, 146, .34);
  --warn: #e3a93c;
  --warn-soft: rgba(227, 169, 60, .14);
  --warn-line: rgba(227, 169, 60, .34);
  --danger: #ff6f6a;
  --danger-soft: rgba(255, 111, 106, .14);
  --danger-line: rgba(255, 111, 106, .34);
  --enforce: #ff7a58;
  --enforce-soft: rgba(255, 122, 88, .14);
  --enforce-line: rgba(255, 122, 88, .34);
  --neutral: #98a1b0;
  --neutral-soft: rgba(152, 161, 176, .14);
  --focus: #8fb0ff;
}

/* 1. 基础 ---------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font: 13.5px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, figure { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button { font: inherit; color: inherit; }
svg { display: block; }
a { color: var(--accent); }
/* 去掉浏览器默认描边：焦点一律由控件自身的 1px 边框或内描边表达（见「聚焦可见性」） */
:focus { outline: none; }
:focus-visible { outline: none; }
::selection { background: var(--accent-soft); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: absolute; left: 12px; top: -60px; z-index: 100;
  padding: 8px 12px; border-radius: var(--r-sm); background: var(--card);
  border: 1px solid var(--accent); color: var(--fg); text-decoration: none;
  transition: top var(--t-fast) var(--ease);
}
.skip-link:focus-visible { top: 12px; }

/* 2. 顶栏 ---------------------------------------------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 18px; background: var(--card);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  display: grid; place-items: center; flex: 0 0 auto;
  width: 32px; height: 32px; border-radius: 10px;
  background: var(--accent-soft); color: var(--accent);
}
.brand-text { min-width: 0; display: block; }
.brand-name { display: block; font-size: 14px; font-weight: 650; letter-spacing: .01em; line-height: 1.3; }
.brand-sub { display: block; font-size: 11.5px; color: var(--fg-mute); line-height: 1.35; }
.topbar-right {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-left: auto;
}
.refresh-age { font-size: 11.5px; color: var(--fg-mute); white-space: nowrap; }
.conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-dim); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-mute); flex: 0 0 7px; }
.dot[data-kind="ok"] { background: var(--ok); }
.dot[data-kind="bad"] { background: var(--danger); }
.dot[data-kind="busy"] { background: var(--accent); }
.gen { font-size: 11.5px; color: var(--fg-dim); white-space: nowrap; padding: 0 4px; }

/* 3. 分段控件（模式 / 标签页 / 匹配模式） --------------------------------- */
.modesw, .tabs, .seg {
  display: inline-flex; align-items: center; gap: 2px; padding: 3px;
  border-radius: var(--r-pill); background: var(--inset);
}

/* 分段控件放进纵向 flex（表单 / 弹窗）时默认会被 align-items: stretch 拉满整行，
   这里让它只包裹自己的选项 */
.seg { align-self: flex-start; }
.mode-btn, .tab, .seg-item > span {
  height: 26px; padding: 0 12px; border: 0; border-radius: var(--r-pill);
  background: transparent; color: var(--fg-dim); font-size: 12.5px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap;
  transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.mode-btn:hover, .tab:hover { color: var(--fg); background: var(--card-soft); }
.mode-btn[aria-pressed="true"], .tab[aria-selected="true"] {
  background: var(--card); color: var(--fg);
}
.mode-btn[aria-pressed="true"][data-mode="enforce"] { color: var(--enforce); }
.mode-btn[aria-pressed="true"][data-mode="observe"] { color: var(--warn); }
.mode-btn[aria-pressed="true"][data-mode="disabled"] { color: var(--neutral); }
.seg-item { position: relative; }
.seg-item > input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
.seg-item > input:checked + span { background: var(--card); color: var(--fg); }
/* 焦点样式统一在「聚焦可见性」一节定义 */
.tab-count {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: 10.5px; line-height: 15px; min-width: 15px; padding: 0 4px;
  border-radius: var(--r-pill); background: var(--inset); color: var(--fg-mute); text-align: center;
}
.tab[aria-selected="true"] .tab-count { background: var(--accent-soft); color: var(--accent-text); }
.tab-count[data-tone="danger"] { background: var(--danger-soft); color: var(--danger); }

.tabbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  /* 与 .main 用同一套 max-width + 居中对齐，保证 tab 与右侧归纳信息跟卡片左右边界齐平 */
  max-width: 1680px; margin: 0 auto; padding: 12px 18px 0;
}
.tabbar-tools { margin-left: auto; font-size: 11.5px; color: var(--fg-mute); }

/* 4. 模式横幅 / 连接横幅 -------------------------------------------------- */
/* 4. 模式说明 / 连接横幅 --------------------------------------------------- */
.mode-hint {
  display: inline-flex; align-items: center; gap: 6px; min-width: 0;
  font-size: 12px; color: var(--fg-mute); line-height: 1.4;
}
.mode-hint[data-mode] { color: var(--fg-mute); }
.mode-hint-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 说明文字保持中性灰，不用语义色，避免看起来像告警 */
.banners { display: flex; flex-direction: column; }
.banners:empty { display: none; }
.banner {
  display: flex; align-items: center; gap: 10px; padding: 9px 18px;
  font-size: 12.5px; background: var(--danger-soft); color: var(--fg);
}
.banner .banner-text { min-width: 0; word-break: break-word; }
.banner[data-kind="warn"] { background: var(--warn-soft); }
.banner .btn { margin-left: auto; flex: 0 0 auto; }

/* 5. 主区 ---------------------------------------------------------------- */
.main { padding: 14px 18px 44px; max-width: 1680px; margin: 0 auto; }
.view { display: flex; flex-direction: column; gap: 14px; }
.view[hidden] { display: none; }

/* 6. 卡片 ---------------------------------------------------------------- */
.card {
  background: var(--card);
  border-radius: var(--r-lg); overflow: hidden;
}
.card-head {
  display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap;
  padding: 13px 16px;
}
.card-head-text { min-width: 0; }
.card-title { font-size: 13.5px; font-weight: 600; line-height: 1.4; }
.card-title .mono { font-size: 13.5px; }
.card-sub { margin-top: 3px; font-size: 11.5px; color: var(--fg-mute); line-height: 1.5; }
.card-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hint {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 10px 16px; font-size: 12px; line-height: 1.6; color: var(--fg-dim);
  background: var(--card-soft);
}
.hint .icon { margin-top: 1px; flex: 0 0 auto; color: var(--fg-mute); }
.hint b { color: var(--fg); font-weight: 600; }

/* 7. 按钮 ---------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; padding: 0 11px; border-radius: var(--r-sm); vertical-align: middle;
  border: 1px solid var(--line-strong); background: var(--card); color: var(--fg);
  font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background-color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.btn:hover { background: var(--inset); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); border-color: transparent; color: #fff; }
html[data-theme="dark"] .btn-primary { color: #10131a; }
.btn-primary:hover { background: var(--accent-strong); }
.btn-danger { color: var(--danger); border-color: var(--danger-line); background: var(--card); }
.btn-danger:hover { background: var(--danger-soft); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--fg-dim); }
.btn-ghost:hover { background: var(--inset); color: var(--fg); }
.btn-sm { height: 26px; padding: 0 9px; font-size: 12px; }
/* 危险动作（删除）与同排按钮保持同一形态：图标 + 文字，只换语义色 */
.btn.is-danger { color: var(--danger); }
.btn.is-danger:hover { background: var(--danger-soft); color: var(--danger); }
.cell-actions > .btn + .btn { margin-left: 6px; }
.btn[disabled], .icon-btn[disabled] { opacity: .55; cursor: not-allowed; transform: none; }
.icon-btn {
  display: inline-grid; place-items: center; width: 30px; height: 30px; padding: 0;
  border-radius: var(--r-sm); border: 1px solid transparent; background: transparent;
  color: var(--fg-dim); cursor: pointer;
  transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.icon-btn:hover { background: var(--inset); color: var(--fg); }
.icon-btn.is-danger:hover { background: var(--danger-soft); color: var(--danger); }
.icon-btn.icon-sm { width: 26px; height: 26px; }

/* 8. 标记 / 徽标 --------------------------------------------------------- */
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  height: 20px; padding: 0 7px; border-radius: var(--r-pill);
  border: 1px solid transparent; background: var(--inset); color: var(--fg-dim);
  font-size: 11.5px; font-weight: 500; white-space: nowrap;
}
.tag.mono { font-size: 11.5px; }
.tag-ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-line); }
.tag-warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }
.tag-danger { background: var(--danger-soft); color: var(--danger); border-color: var(--danger-line); }
.tag-accent { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent-line); }
.tag-neutral { background: var(--neutral-soft); color: var(--neutral); }

/* 9. 表格 ---------------------------------------------------------------- */
/* 表格：表头与每一行都是独立圆角色块，行间留缝，左右与卡片留内边距——
   这样隔行底色才有明显边界，不靠任何横线 */
.table-wrap { overflow-x: auto; padding: 2px 10px 12px; }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 13px; }
.tbl th {
  text-align: left; font-weight: 600; font-size: 11.5px; color: var(--fg-dim);
  padding: 10px 16px; background: var(--thead);
  white-space: nowrap;
}
.tbl th:first-child { border-radius: var(--r-sm) 0 0 var(--r-sm); }
.tbl th:last-child { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.tbl td { padding: 13px 16px; vertical-align: middle; }
/* 隔行底色按「数据行序号」算，展开的详情行不参与计数，
   否则插入子项后下面每一行的奇偶都翻面，颜色会整体变掉 */
.tbl tbody tr > td { background: var(--card); }
.tbl tbody tr.is-alt > td { background: var(--stripe); }
.tbl tbody tr > td:first-child { border-radius: var(--r-sm) 0 0 var(--r-sm); }
.tbl tbody tr > td:last-child { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
/* 展开的详情行：底色收进内嵌面板，和文字一起缩进（不是把整行铺成灰块） */
.tbl tbody tr.is-detail > td,
.tbl tbody tr.is-detail:hover > td { background: transparent; padding: 0 16px; }
.tbl .detail-panel {
  display: flex; flex-direction: column; gap: 6px;
  padding: 12px 16px; border-radius: var(--r-sm); background: var(--inset);
}
.tbl th.num, .tbl td.num { text-align: right; }
.tbl .cell-actions { text-align: right; white-space: nowrap; }
.cell-stack { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cell-main { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500; word-break: break-all; min-width: 10ch; }
.cell-note { font-size: 11.5px; color: var(--fg-mute); }
.cell-note.is-danger { color: var(--danger); white-space: normal; }
.src-list { display: flex; flex-wrap: wrap; gap: 6px; }
.src-chip {
  font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 11.5px;
  padding: 2px 8px; border-radius: var(--r-pill);
  background: var(--inset); color: var(--fg-dim);
}
.row-members { margin-top: 8px; display: grid; gap: 4px; font-size: 12px; }
.row-members div { display: flex; gap: 8px; flex-wrap: wrap; color: var(--fg-dim); }

/* 10. 空态 --------------------------------------------------------------- */
.empty {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 40px 24px; text-align: center;
}
.empty-icon {
  display: grid; place-items: center; width: 40px; height: 40px;
  border-radius: var(--r-md); background: var(--inset); color: var(--fg-mute);
}
.empty-title { font-size: 13.5px; font-weight: 600; }
.empty-desc { max-width: 46ch; font-size: 12.5px; line-height: 1.65; color: var(--fg-dim); }
.empty-actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; justify-content: center; }

/* 11. 授权矩阵 ----------------------------------------------------------- */
.matrix {
  display: grid; grid-template-columns: 340px minmax(0, 1fr);
  gap: 14px; align-items: start;
}
.plist { display: flex; flex-direction: column; gap: 2px; padding: 6px; }
.pitem {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
  border-radius: var(--r-md);
  transition: background-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.pitem:hover { background: var(--card-soft); }
.pitem.is-sel { background: var(--accent-soft); }
.pitem.is-sel .pitem-name { color: var(--accent-text); }
.pitem-pick {
  display: flex; flex-direction: column; gap: 3px; min-width: 0;
  padding: 9px 12px; border: 0; background: transparent; text-align: left;
  border-radius: var(--r-md); cursor: pointer;
}
.pitem-name { font-size: 13px; font-weight: 600; word-break: break-all; }
.pitem-sub { font-size: 11.5px; color: var(--fg-dim); line-height: 1.45; word-break: break-word; }
.pitem.is-sel .pitem-name { color: var(--accent-text); }
.pitem-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.pitem-actions { display: flex; gap: 1px; padding-right: 6px; opacity: .7; transition: opacity var(--t-fast) var(--ease); }
.pitem:hover .pitem-actions, .pitem:focus-within .pitem-actions { opacity: 1; }

.grants { display: flex; flex-direction: column; gap: 1px; padding: 6px; }
.grant {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center; gap: 12px; padding: 9px 10px; border-radius: var(--r-md);
  transition: background-color var(--t-fast) var(--ease);
}
.grant:hover { background: var(--card-soft); }
.grant-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.grant-target { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 500; word-break: break-all; }
.grant-flow { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--fg-dim); }
.grant-flow .icon { color: var(--fg-mute); }
.grant-flow b { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; color: var(--fg); }
.grant-side { display: flex; align-items: center; gap: 8px; }
.grant[aria-busy="true"] { opacity: .65; }

/* 胶囊开关 */
.sw {
  appearance: none; -webkit-appearance: none; position: relative; margin: 0;
  flex: 0 0 auto; width: 40px; height: 23px; border-radius: var(--r-pill);
  background: var(--inset); border: 1px solid var(--line-strong); cursor: pointer;
  transition: background-color var(--t-base) var(--ease), border-color var(--t-base) var(--ease);
}
.sw::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px;
  border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(16, 24, 40, .25);
  transition: transform var(--t-base) var(--ease-spring);
}
.sw:checked { background: var(--accent); border-color: var(--accent); }
.sw:checked::after { transform: translateX(17px); }
.sw:hover:not(:disabled) { border-color: var(--accent); }
.sw:disabled { cursor: progress; opacity: .7; }

/* 12. 运行状态 ----------------------------------------------------------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.stat {
  display: flex; flex-direction: column; gap: 6px; min-height: 96px;
  padding: 13px 14px; background: var(--card); border-radius: var(--r-md);
}
.stat-label { font-size: 11.5px; color: var(--fg-mute); }
.stat-value {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: 19px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.stat-value.is-text { font-family: var(--sans); font-size: 15px; }
.stat-note { margin-top: auto; font-size: 11.5px; line-height: 1.55; color: var(--fg-dim); }
.stat-note.is-danger { color: var(--danger); }
.status-bottom { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
.warnbox { background: var(--card); border-radius: var(--r-lg); overflow: hidden; }
.warnbox > summary {
  display: flex; align-items: center; gap: 9px; padding: 13px 16px;
  font-size: 13px; font-weight: 600; cursor: pointer; list-style: none;
}
.warnbox > summary::-webkit-details-marker { display: none; }
.warnbox > summary:hover { background: var(--card-soft); }
.warnbox > summary .summary-count { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--warn); }
.warnbox > summary .icon-end { margin-left: auto; color: var(--fg-mute); transition: transform var(--t-fast) var(--ease); }
.warnbox[open] > summary { background: var(--card-soft); }
.warnbox[open] > summary .icon-end { transform: rotate(180deg); }
.warnbox pre {
  margin: 0; padding: 14px 16px; max-height: 320px; overflow: auto;
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: 12px; line-height: 1.7; color: var(--fg-dim);
  white-space: pre-wrap; word-break: break-word;
}
.health { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; }
.health-line { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; color: var(--fg-dim); line-height: 1.6; }
.health-line b { color: var(--fg); font-weight: 600; }
.health-line.is-ok b { color: var(--ok); }
.health-line.is-bad b { color: var(--danger); }
.health-meta { font-size: 11.5px; color: var(--fg-mute); }

/* 13. 弹窗 --------------------------------------------------------------- */
.scrim {
  position: fixed; inset: 0; z-index: 80; display: grid; place-items: center;
  padding: 16px; background: rgba(13, 17, 24, .48);
  animation: fade var(--t-base) var(--ease);
}
.modal {
  width: min(560px, 100%); max-height: min(86vh, 780px);
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--card); color: var(--fg);
  border-radius: var(--r-lg);
  animation: pop 240ms var(--ease-spring);
}
.modal.modal-wide { width: min(680px, 100%); }
.modal-head { display: flex; align-items: flex-start; gap: 12px; padding: 16px 16px 12px; }
.modal-head-text { min-width: 0; }
.modal-title { font-size: 15px; font-weight: 650; line-height: 1.4; }
.modal-sub { margin-top: 4px; font-size: 12px; color: var(--fg-mute); line-height: 1.55; }
.modal-x { margin-left: auto; flex: 0 0 auto; }
.modal-body {
  display: flex; flex-direction: column; gap: 14px;
  padding: 4px 16px 16px; overflow: auto;
}
.modal-foot {
  display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap;
  padding: 12px 16px; background: var(--card-soft);
}
.modal-lead { font-size: 13.5px; line-height: 1.6; }
.modal-note { font-size: 12.5px; line-height: 1.65; color: var(--fg-dim); }
.modal-warn {
  display: flex; gap: 8px; padding: 10px 12px; border-radius: var(--r-md);
  font-size: 12.5px; line-height: 1.6;
  background: var(--danger-soft); color: var(--fg);
}
.modal-warn .icon { flex: 0 0 auto; margin-top: 1px; color: var(--danger); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; font-size: 12.5px; }
.kv dt { color: var(--fg-mute); }
.kv dd { margin: 0; min-width: 0; word-break: break-word; }

/* 14. 表单 --------------------------------------------------------------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: 12px; font-weight: 600; color: var(--fg); }
.field-hint { font-size: 11.5px; line-height: 1.55; color: var(--fg-mute); }
.field-err { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--danger); line-height: 1.5; }
.field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.input {
  width: 100%; height: 34px; padding: 0 10px; border-radius: var(--r-sm);
  border: 1px solid var(--line-strong); background: var(--card); color: var(--fg);
  font: inherit; font-size: 13px;
  transition: border-color var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease);
}
.input::placeholder { color: var(--fg-mute); }
.input:hover { border-color: var(--fg-mute); }
.input:focus { border-color: var(--focus); }
.input[aria-invalid="true"] { border-color: var(--danger); }
/* 自绘下拉：原生 select 的展开列表由系统渲染（Windows 上是系统样式，CSS 改不动），
   因此整只控件自绘，只保留 select 的调用方式：appendChild(option) / .value / change 事件 */
.sel { position: relative; }
.sel-btn {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 34px; padding: 0 10px;
  border-radius: var(--r-sm); border: 1px solid var(--line-strong);
  background: var(--card); color: var(--fg); font: inherit; font-size: 13px;
  text-align: left; cursor: pointer;
  transition: border-color var(--t-fast) var(--ease);
}
.sel-btn:hover { border-color: var(--fg-mute); }
.sel-btn[aria-expanded="true"], .sel-btn:focus-visible { border-color: var(--focus); }
.sel-btn:disabled { opacity: .55; cursor: not-allowed; }
.sel-btn:disabled:hover, .sel-btn:disabled[aria-expanded="true"] { border-color: var(--line-strong); }
.sel-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sel-label.is-empty { color: var(--fg-mute); }
.sel-caret { flex: 0 0 auto; color: var(--fg-mute); transition: transform var(--t-fast) var(--ease); }
.sel-btn[aria-expanded="true"] .sel-caret { transform: rotate(180deg); }
.sel-pop {
  position: fixed; z-index: 120; padding: 4px; max-height: 264px; overflow: auto;
  background: var(--card); border: 1px solid var(--line-strong); border-radius: var(--r-md);
}
.sel-pop[hidden] { display: none; }
.sel-opt {
  display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: var(--r-sm);
  font-size: 13px; color: var(--fg); cursor: pointer; white-space: nowrap;
}
.sel-opt:hover, .sel-opt.is-active { background: var(--accent-soft); }
.sel-opt[aria-selected="true"] { color: var(--accent-text); font-weight: 600; }
.sel-opt-mark { margin-left: auto; display: inline-flex; color: var(--accent-text); }
.field-inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* 15. Toast -------------------------------------------------------------- */
.toasts {
  position: fixed; right: 16px; bottom: 16px; z-index: 90;
  display: flex; flex-direction: column; gap: 8px;
  width: min(420px, calc(100vw - 32px));
}
.toast {
  display: flex; align-items: flex-start; gap: 9px; padding: 10px 12px;
  background: var(--card); border-radius: var(--r-md); font-size: 12.5px;
  animation: pop 220ms var(--ease-spring);
}
}
.toast .icon { flex: 0 0 auto; margin-top: 1px; color: var(--fg-mute); }
.toast::before { content: ""; flex: 0 0 3px; align-self: stretch; border-radius: 2px; background: var(--fg-mute); }
.toast-ok::before { background: var(--ok); }
.toast-ok .icon { color: var(--ok); }
.toast-warn::before { background: var(--warn); }
.toast-warn .icon { color: var(--warn); }
.toast-err::before { background: var(--danger); }
.toast-err .icon { color: var(--danger); }
.toast-text { margin: 0; min-width: 0; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.toast.is-out { animation: toastOut 200ms var(--ease) forwards; }

/* 16. 聚焦可见性：只把控件自身的 1px 边框换成强调色，不叠加外描边或粗环 ------ */
/* 有边框的按钮：换 1px 边框色（ghost 的透明边框也会显出来，不会再多套一层框） */
.btn:focus-visible, .icon-btn:focus-visible, .sw:focus-visible { border-color: var(--focus); }
/* 无边框控件（标签页、模式切换、分段控件单选、负载列表项）：用 1px 内描边表达焦点 */
.tab:focus-visible, .mode-btn:focus-visible, .pitem-pick:focus-visible,
.seg-item > input:focus-visible + span { box-shadow: inset 0 0 0 1px var(--focus); }

/* 17. 动效 --------------------------------------------------------------- */
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop {
  from { opacity: 0; transform: translateY(8px) scale(.985); }
  to { opacity: 1; transform: none; }
}
@keyframes toastOut { to { opacity: 0; transform: translateY(4px); } }
@keyframes rise {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}
.enter > * { animation: rise 260ms var(--ease-spring) backwards; }
.enter > *:nth-child(1) { animation-delay: 0ms; }
.enter > *:nth-child(2) { animation-delay: 35ms; }
.enter > *:nth-child(3) { animation-delay: 70ms; }
.enter > *:nth-child(4) { animation-delay: 105ms; }
.enter > *:nth-child(5) { animation-delay: 140ms; }
.enter > *:nth-child(6) { animation-delay: 175ms; }
.enter > *:nth-child(n+7) { animation-delay: 200ms; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-delay: 0ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
  }
  .enter > * { animation: none; }
}

/* 18. 响应式 ------------------------------------------------------------- */
@media (max-width: 1279px) {
  .matrix { grid-template-columns: 296px minmax(0, 1fr); }
  .status-bottom { grid-template-columns: minmax(0, 1fr) 300px; }
}
@media (max-width: 1080px) {
  .status-bottom { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 899px) {
  .matrix { grid-template-columns: minmax(0, 1fr); }
  .plist { max-height: 300px; overflow: auto; }
  .main { padding: 12px 12px 40px; }
  .topbar, .tabbar, .banner { padding-left: 12px; padding-right: 12px; }
  .mode-hint { display: none; }
  .topbar { gap: 10px; }
  .brand-sub { display: none; }
}
@media (max-width: 640px) {
  .field-row { grid-template-columns: minmax(0, 1fr); }
  .topbar-right { width: 100%; margin-left: 0; }
  .tabbar { gap: 8px; }
  .tabbar-tools { width: 100%; margin-left: 0; }
  .tab, .mode-btn { padding: 0 10px; }
  .grant { grid-template-columns: auto minmax(0, 1fr); }
  .grant-side { grid-column: 2; justify-content: flex-start; }
  .stat { min-height: 0; }
}
</style>
</head>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" id="brandMark" aria-hidden="true"></span>

      <span class="brand-name" data-i18n="出网代理">出网代理</span>

    </span>

    <span class="conn" id="conn"><span class="dot" id="connDot" data-kind="busy"></span><span id="connText" data-i18n="连接中">连接中</span></span>

<script>
(function () {
  'use strict';

  /* 允许反向代理把 UI 挂在子路径下，或本地联调时指向 mock 控制器 */
  var API = String(window.__EGP_API_BASE || '').replace(/\/+$/, '');
  var POLL_MS = 5000;
  var STALE_MS = 60000;

  /* ------------------------------------------------------------------ *
   * 国际化（zh / en）                                                   *
   * ------------------------------------------------------------------ *
   *  - 语言在首帧前就定了：localStorage.egp_lang > ?lang= > 系统语言，见 <head>
   *  - 文案以「中文原文」为 key，全部集中在下表；未命中的串原样回退中文，
   *    所以漏译只会留下一句中文，不会把 key 名糊到界面上
   *  - 含动态数值的句子（「3 个负载」「5 秒前」）走 RULES 里的正则，按语言重排语序
   *  - 翻译只发生在写 DOM 的边界（h() / appendKid() / textContent），
   *    内部状态、接口参数、data-* 属性始终是原值，展示与逻辑不耦合
   * ------------------------------------------------------------------ */
  var LANG = window.__EGP_LANG === 'en' ? 'en' : 'zh';
  var IS_EN = LANG === 'en';

  function pl(count, one, many) { return String(count) === '1' ? '1 ' + one : count + ' ' + many; }

  /* 动态句：数组顺序即匹配优先级，具体规则必须在通用规则之前 */
  var EN_RULES = [
    /* 时间 */
    [/^刚刚$/, 'just now'],
    [/^(\d+) 分 (\d+) 秒前$/, function (m) { return m[1] + 'm ' + m[2] + 's ago'; }],
    [/^(\d+) 秒前$/, function (m) { return m[1] + 's ago'; }],
    [/^(\d+) 分钟前$/, function (m) { return m[1] + 'm ago'; }],
    [/^(\d+) 小时前$/, function (m) { return m[1] + 'h ago'; }],
    [/^(\d+) 天前$/, function (m) { return m[1] + 'd ago'; }],
    [/^刷新于 (.*)$/, function (m) { return 'Refreshed ' + T(m[1]); }],
    /* HTTP / 控制器 */
    [/^请求失败（HTTP (\d+)）$/, 'Request failed (HTTP $1)'],
    [/^接口返回了非 JSON 响应（HTTP (\d+)），可能是控制器版本不匹配$/, 'Non-JSON response (HTTP $1); the controller version may not match'],
    [/^Pod 索引异常：(.*)$/, 'Pod index error: $1'],
    [/^(.*?)（页面显示的是 (.*?)的数据）$/, function (m) { return m[1] + ' (showing data from ' + T(m[2]) + ')'; }],
    [/^[，,]\s*gen (\d+)(.*)$/, function (m) {
      return ', gen ' + m[1] + String(m[2] || '').replace('，存储 ', ', store ').replace('，模式 ', ', mode ');
    }],
    [/^：(.*)$/, ': $1'],
    /* 标签栏汇总 */
    [/^外部服务 (\d+) 个，负载 (\d+) 个，节点 (\d+) 个$/, function (m) {
      return pl(m[1], 'service', 'services') + ', ' + pl(m[2], 'payload', 'payloads') + ', ' + pl(m[3], 'node', 'nodes');
    }],
    /* 外部服务视图 */
    [/^(\d+) 个目标，其中 (\d+) 个还没有任何负载被授权$/, function (m) {
      return pl(m[1], 'target', 'targets') + ', ' + m[2] + ' of them without any authorized payload';
    }],
    [/^(\d+) 个目标，全部已有负载被授权$/, function (m) {
      return pl(m[1], 'target', 'targets') + ', all with authorized payloads';
    }],
    [/^生效源 (\d+) 条（由已授权的负载匹配到的 Pod IP 汇总）$/, function (m) {
      return pl(m[1], 'source', 'sources') + ' (Pod IPs matched by authorized payloads)';
    }],
    [/^生效源 (\d+) 条$/, function (m) { return pl(m[1], 'source', 'sources'); }],
    /* 授权矩阵 */
    [/^标签 (.*) @ (.*)$/, 'Labels $1 @ $2'],
    [/^仅按命名空间 (.*)$/, 'Namespace $1 only'],
    [/^(.*)；已授权 (\d+) \/ (\d+) 个外部服务$/, '$1; $2 / $3 services authorized'],
    [/^(撤销|授予)(.*) 访问 (.*) 的授权$/, function (m) {
      return (m[1] === '撤销' ? 'Revoke ' : 'Grant ') + m[2] + ' access to ' + m[3];
    }],
    [/^（目标端口 (\d+)）$/, '(target port $1)'],
    [/^查看负载 (.*) 的授权$/, 'View grants for $1'],
    [/^编辑负载 (.*)$/, 'Edit payload $1'],
    [/^删除负载 (.*)$/, 'Delete payload $1'],
    [/^(\d+) 个负载$/, function (m) { return pl(m[1], 'payload', 'payloads'); }],
    [/^(\d+) 个 Pod$/, function (m) { return pl(m[1], 'Pod', 'Pods'); }],
    [/^(\d+) 项授权$/, function (m) { return pl(m[1], 'grant', 'grants'); }],
    [/^(\d+) 个负载已授权$/, function (m) { return m[1] + ' payloads authorized'; }],
    /* 运行状态视图 */
    [/^(直通|观察|强制)模式$/, function (m) { return (EN[m[1]] || m[1]) + ' mode'; }],

    return (store.data ? store.data.targets.slice() : []).sort(function (a, b) {

      return a.port - b.port;
    });
  }
  function payloadSummary(p) {
    var ns = p.namespaces.length ? p.namespaces[0] : '所有命名空间';
    if (p.workload && p.workload.name) {
      return (p.workload.kind || 'Deployment') + '/' + p.workload.name + ' @ ' + ns;
    }
    var labelKeys = Object.keys(p.matchLabels || {});
    if (labelKeys.length) return '标签 ' + labelsToText(p.matchLabels) + ' @ ' + ns;

  }

  /* ------------------------------------------------------------------ *
   * 焦点管理（整块重渲染后把焦点放回原处）                              *
   * ------------------------------------------------------------------ */
  function captureFocus() {
    var a = document.activeElement;
    if (!a || !a.dataset || !a.dataset.fk) return null;
    var snap = { fk: a.dataset.fk, input: null };
    if (a.tagName === 'INPUT' || a.tagName === 'SELECT') {
      snap.input = { value: a.value, selStart: a.selectionStart, selEnd: a.selectionEnd, checked: a.checked };
    }
    return snap;
  }
  function restoreFocus(snap) {
    if (!snap) return;
    var node;
    try {
      node = document.querySelector('[data-fk="' + snap.fk.replace(/["\\]/g, '\\$&') + '"]');
    } catch (e) { node = null; }
    if (!node) return;
    try {
      node.focus({ preventScroll: true });
      if (snap.input && node.tagName === 'INPUT') {
        if (snap.input.value !== undefined && node.type !== 'checkbox') node.value = snap.input.value;
        if (typeof snap.input.selStart === 'number' && node.setSelectionRange) {
          node.setSelectionRange(snap.input.selStart, snap.input.selEnd);
        }
        if (typeof snap.input.checked === 'boolean' && node.type === 'checkbox') node.checked = snap.input.checked;
      }
    } catch (e) { /* ignore */ }
  }

  /* 触发元素被重渲染替换时，等下一次渲染完成再把焦点还给同 data-fk 的节点 */
  function applyPendingFocus() {
    if (!ui.pendingFocus) return;
    var fk = ui.pendingFocus;
    ui.pendingFocus = null;
    var a = document.activeElement;
    if (a && a !== document.body && a !== document.documentElement) return;
    var node = document.querySelector('[data-fk="' + fk.replace(/["\\]/g, '\\$&') + '"]');
    if (node) { try { node.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
  }

  /* ------------------------------------------------------------------ *
   * Toast                                                               *
   * ------------------------------------------------------------------ */
  var TOAST_ICONS = { ok: 'check', warn: 'alert', err: 'alert', info: 'info' };
  function toast(kind, message) {
    var box = document.getElementById('toasts');
    var node = h('div', { class: 'toast toast-' + (kind || 'info'), role: kind === 'err' ? 'alert' : 'status' });
    node.appendChild(icon(TOAST_ICONS[kind] || 'info', 15));
    node.appendChild(h('p', { class: 'toast-text', text: message }));
    box.appendChild(node);
    while (box.childElementCount > 4) box.removeChild(box.firstChild);
    var ttl = kind === 'err' ? 9000 : 4500;
    setTimeout(function () {
      node.classList.add('is-out');
      setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 220);
    }, ttl);
  }

  /* ------------------------------------------------------------------ *
   * 轮询 / 刷新                                                         *
   * ------------------------------------------------------------------ */
  var pollTimer = null;
  var ageTimer = null;
  var lastConn = 'busy';

  function setConn(kind) {
    var dot = document.getElementById('connDot');
    var txt = document.getElementById('connText');
    if (dot) dot.setAttribute('data-kind', kind);
    lastConn = kind;
    if (txt) txt.textContent = T(kind === 'ok' ? '已连接' : (kind === 'bad' ? '连接失败' : '连接中'));
  }

  function refresh(opts) {
    if (store.fetching) return Promise.resolve();
    store.fetching = true;
    setConn('busy');
    return request('/api/v1/state').then(function (raw) {
      store.data = normalizeState(raw);
      store.error = '';
      store.loaded = true;
      store.lastOkAt = Date.now();
      store.authPrompted = false;
      setConn('ok');
      if (ui.selectedPayload && !findPayload(ui.selectedPayload)) ui.selectedPayload = null;
      if (!ui.selectedPayload && store.data.payloads.length) ui.selectedPayload = store.data.payloads[0].name;
    }).catch(function (e) {
      store.loaded = true;
      store.error = e.message || '读取状态失败';
      setConn('bad');
      if (e.kind === 'auth' && !store.authPrompted) {
        store.authPrompted = true;
        promptToken('控制器要求访问令牌，请填写后再继续');
      }
      if (!opts || !opts.silent) toast('err', store.error);
    }).then(function () {
      store.fetching = false;
      renderAll();
      schedulePoll();
    });
  }

  function schedulePoll() {
    stopPoll();
    if (document.hidden) return;
    pollTimer = setTimeout(function () { refresh({ silent: true }); }, POLL_MS);
  }
  function stopPoll() {
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  }

  function tickClock() {
    var el = document.getElementById('refreshAge');
    if (!el) return;
    if (!store.lastOkAt) { el.textContent = T('刷新于 —'); return; }
    el.textContent = T('刷新于 ' + fmtAgo(Date.now() - store.lastOkAt));
    var nodes = document.querySelectorAll('[data-ts]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = relTime(nodes[i].dataset.ts);
    }
  }

  /* ------------------------------------------------------------------ *
   * 渲染：顶栏 / 横幅 / 标签页                                          *
   * ------------------------------------------------------------------ */
  function iconBtn(name, label, opts) {
    opts = opts || {};
    var b = h('button', {
      type: 'button',
      class: 'icon-btn' + (opts.small ? ' icon-sm' : '') + (opts.danger ? ' is-danger' : '') + (opts.cls ? ' ' + opts.cls : ''),
      'aria-label': label,
      title: opts.title || label,

  /* 自绘下拉：原生 <select> 的展开列表是系统渲染的，样式改不动，
     所以整只控件自绘，但保留 select 的调用方式（appendChild(option) / .value / change 事件） */
  var openSelect = null;

  function hSelect(opts) {
    opts = opts || {};
    var items = [];
    var cur = '';
    var isOpen = false;
    var activeIdx = -1;
    var root = h('div', { class: 'sel' });
    var btn = h('button', {
      type: 'button',
      class: 'sel-btn' + (opts.cls ? ' ' + opts.cls : ''),
      id: opts.id || null,
      'data-fk': opts.fk || null,
      'aria-haspopup': 'listbox',
      'aria-expanded': 'false',
      disabled: !!opts.disabled
    });
    var label = h('span', { class: 'sel-label' });
    var caret = icon('chevronDown', 14);
    caret.setAttribute('class', 'icon sel-caret');
    btn.appendChild(label);
    btn.appendChild(caret);
    root.appendChild(btn);
    var pop = h('div', { class: 'sel-pop', role: 'listbox', hidden: 'hidden' });

    function renderLabel() {
      var text = '';
      for (var i = 0; i < items.length; i++) if (items[i].value === cur) { text = items[i].text; break; }
      label.textContent = T(text || '请选择');
      label.classList.toggle('is-empty', !text || cur === '');
    }
    function renderList() {
      clear(pop);
      items.forEach(function (it, i) {
        var opt = h('div', {
          class: 'sel-opt', role: 'option', 'aria-selected': it.value === cur ? 'true' : 'false'
        }, h('span', { text: it.text }));
        if (it.value === cur) opt.appendChild(h('span', { class: 'sel-opt-mark' }, icon('check', 13)));
        // mousedown 只阻止默认行为（保住按钮焦点、避免选中文字），选中放在 click 上，
        // 否则「mousedown 关浮层」之后真实的 mouseup 会落到浮层下方的按钮，click 又把浮层打开
        opt.addEventListener('mousedown', function (ev) { ev.preventDefault(); });
        opt.addEventListener('click', function () { pick(i); });
        pop.appendChild(opt);
      });
    }
    function setActive(i) {
      if (i < 0 || i >= items.length) return;
      activeIdx = i;
      for (var k = 0; k < pop.children.length; k++) pop.children[k].classList.toggle('is-active', k === i);
      var node = pop.children[i];
      if (node) {
        // 手动滚动到可视区，不用 scrollIntoView：那会连带触发祖先滚动，被当成「页面滚走了」关掉浮层
        var top = node.offsetTop - 4;
        var bottom = top + node.offsetHeight;
        if (top < pop.scrollTop) pop.scrollTop = top;
        else if (bottom > pop.scrollTop + pop.clientHeight) pop.scrollTop = bottom - pop.clientHeight;
      }
    }
    function onDocDown(ev) {
      if (root.contains(ev.target) || pop.contains(ev.target)) return;
      closePop();
    }
    function onScroll(ev) {
      // 浮层自己滚动不算「页面滚走了」
      if (ev.target === pop || pop.contains(ev.target)) return;
      closePop();
    }
    function onKeyDown(ev) {
      var k = ev.key;
      if (k === 'Escape' || k === 'Tab') {
        closePop();
        if (k === 'Escape') { ev.preventDefault(); ev.stopPropagation(); }
        return;
      }
      if (k === 'ArrowDown') { ev.preventDefault(); ev.stopPropagation(); setActive(Math.min(items.length - 1, activeIdx + 1)); return; }
      if (k === 'ArrowUp') { ev.preventDefault(); ev.stopPropagation(); setActive(Math.max(0, activeIdx - 1)); return; }
      if (k === 'Home') { ev.preventDefault(); setActive(0); return; }
      if (k === 'End') { ev.preventDefault(); setActive(items.length - 1); return; }
      if (k === 'Enter' || k === ' ') { ev.preventDefault(); ev.stopPropagation(); pick(activeIdx); }
    }
    function pick(i) {
      var it = items[i];
      var changed = !!it && it.value !== cur;
      if (it) cur = it.value;
      renderLabel();
      closePop();
      btn.focus();
      if (changed) root.dispatchEvent(new Event('change', { bubbles: true }));
    }
    function openPop() {
      if (isOpen || !items.length) return;
      isOpen = true;
      if (openSelect) openSelect();
      openSelect = closePop;
      ui.popupOpen = true;
      renderList();
      document.body.appendChild(pop);
      pop.hidden = false;
      var r = btn.getBoundingClientRect();
      var popH = Math.min(pop.scrollHeight, 264);
      pop.style.minWidth = Math.round(r.width) + 'px';
      pop.style.left = Math.round(r.left) + 'px';
      // 下方空间不够且上方更宽裕时向上展开
      var below = window.innerHeight - r.bottom - 8;
      pop.style.top = Math.round(below >= popH || below >= r.top - 8 ? r.bottom + 4 : Math.max(8, r.top - 4 - popH)) + 'px';
      btn.setAttribute('aria-expanded', 'true');
      var start = 0;
      for (var i = 0; i < items.length; i++) if (items[i].value === cur) { start = i; break; }
      setActive(start);
      document.addEventListener('mousedown', onDocDown, true);
      document.addEventListener('keydown', onKeyDown, true);
      window.addEventListener('scroll', onScroll, true);
      window.addEventListener('resize', closePop, true);
    }
    function closePop() {
      if (!isOpen) return;
      isOpen = false;
      if (openSelect === closePop) openSelect = null;
      ui.popupOpen = false;
      btn.setAttribute('aria-expanded', 'false');
      pop.hidden = true;
      if (pop.parentNode) pop.parentNode.removeChild(pop);
      document.removeEventListener('mousedown', onDocDown, true);
      document.removeEventListener('keydown', onKeyDown, true);
      window.removeEventListener('scroll', onScroll, true);
      window.removeEventListener('resize', closePop, true);
    }
    btn.addEventListener('click', function () { if (isOpen) closePop(); else openPop(); });
    btn.addEventListener('keydown', function (ev) {
      if (!isOpen && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) { ev.preventDefault(); openPop(); }
    });

    // 兼容原生 select 的用法：appendChild(<option>) 收集选项，.value 读写当前值
    var rawAppend = root.appendChild.bind(root);
    root.appendChild = function (node) {
      if (node && node.tagName === 'OPTION') {
        items.push({ value: node.value === undefined ? '' : String(node.value), text: (node.textContent || '').trim() });
        if (node.selected) cur = String(node.value || '');
        renderLabel();
        return node;
      }
      return rawAppend(node);
    };
    Object.defineProperty(root, 'value', {
      get: function () { return cur; },
      set: function (next) { cur = next === null || next === undefined ? '' : String(next); renderLabel(); }
    });
    return root;
  }
  function btn(label, opts) {
    opts = opts || {};
    var b = h('button', {
      type: 'button',
      class: 'btn' + (opts.variant ? ' btn-' + opts.variant : '') + (opts.small ? ' btn-sm' : '') + (opts.danger ? ' is-danger' : ''),
      'data-fk': opts.fk || null,

    });

    b.appendChild(document.createTextNode(T(label)));

    return b;
  }

    b.setAttribute('data-theme-pref', pref);
    var label = pref === 'auto'

      th.dataset.bound = '1';

      th.addEventListener('click', function () {
        var cur = readThemePref();
        applyTheme(cur === 'auto' ? 'light' : (cur === 'light' ? 'dark' : 'auto'));
      });

    renderThemeButton();
    renderLangButton();

  function renderModes() {

    if (!box.childElementCount) {
      MODES.forEach(function (m) {
        var b = h('button', {
          type: 'button',

  /* 模式说明放在模式切换右侧，一行小字即可，不再铺整条色带（那看着像报错横幅） */
  function renderModeHint() {

  function renderBanners() {
    var box = document.getElementById('banners');

  function renderTabs() {
    var box = document.getElementById('tabs');
    if (!box.childElementCount) {
      TABS.forEach(function (t) {
        var b = h('button', {
          type: 'button',
          class: 'tab',
          role: 'tab',
          id: 'tab-' + t.id,
          'aria-controls': 'view-' + t.id,
          'aria-selected': 'false',
          'data-tab': t.id,
          'data-fk': 'tab:' + t.id,
          tabindex: '-1'
        });
        b.appendChild(document.createTextNode(T(t.label)));
        b.appendChild(h('span', { class: 'tab-count', text: '0' }));
        b.addEventListener('click', function () { selectTab(t.id, false); });
        box.appendChild(b);
      });
      box.addEventListener('keydown', function (e) {
        var order = TABS.map(function (t) { return t.id; });
        var i = order.indexOf(ui.tab);
        var next = null;
        if (e.key === 'ArrowRight') next = order[(i + 1) % order.length];
        else if (e.key === 'ArrowLeft') next = order[(i - 1 + order.length) % order.length];
        else if (e.key === 'Home') next = order[0];
        else if (e.key === 'End') next = order[order.length - 1];
        if (!next) return;
        e.preventDefault();
        selectTab(next, true);
      });
    }
    var counts = { targets: 0, matrix: 0, status: 0 };
    var danger = {};
    if (store.data) {
      counts.targets = store.data.targets.length;
      counts.matrix = store.data.payloads.length;
      counts.status = store.data.agents.length;
      var behind = store.data.agents.filter(function (a) { return agentIsBehind(a); }).length;
      danger.status = behind > 0 || store.data.warnings.length > 0;
      danger.targets = store.data.targets.filter(function (t) { return refCount(targetKey(t)) === 0; }).length > 0;
    }
    Array.prototype.forEach.call(box.children, function (b) {
      var id = b.getAttribute('data-tab');
      var on = id === ui.tab;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
      var badge = b.querySelector('.tab-count');
      if (badge) {
        badge.textContent = String(counts[id] || 0);
        if (danger[id]) badge.setAttribute('data-tone', 'danger');
        else badge.removeAttribute('data-tone');
      }
    });
    var tools = document.getElementById('tabbarTools');
    if (tools) {
      clear(tools);
      if (store.data) {
        tools.textContent = T('外部服务 ' + counts.targets + ' 个，负载 ' + counts.matrix + ' 个，节点 ' + counts.status + ' 个');
      }
    }
  }

  function selectTab(id, focus) {
    if (ui.tab === id) { if (focus) document.getElementById('tab-' + id).focus(); return; }
    ui.tab = id;
    ui.rendered[id] = false;
    renderAll();
    if (focus) {
      var t = document.getElementById('tab-' + id);
      if (t) t.focus();
    }
  }

  function renderAll() {
    var snap = captureFocus();
    renderModes();
    renderModeHint();
    renderBanners();
    renderTabs();
    var gen = document.getElementById('genLabel');
    if (gen) gen.textContent = store.data ? ('gen ' + store.data.generation) : 'gen —';
    renderView();
    restoreFocus(snap);
    applyPendingFocus();
    tickClock();
  }

  /* ------------------------------------------------------------------ *
   * 渲染：视图调度 + 空/错/载入态                                       *
   * ------------------------------------------------------------------ */
  function renderView() {
    TABS.forEach(function (t) {
      var sec = document.getElementById('view-' + t.id);
      sec.hidden = t.id !== ui.tab;
    });
    var sec = document.getElementById('view-' + ui.tab);
    clear(sec);
    if (!store.loaded) {
      sec.appendChild(h('div', { class: 'card' },
        emptyBlock('activity', '正在读取控制器状态', '首次加载会请求 /api/v1/state，拿到数据后自动渲染，不需要手动刷新', [])));
      return;
    }
    if (!store.data) {
      sec.appendChild(h('div', { class: 'card' },
        emptyBlock('alert', '无法读取控制器状态',
          store.error || '控制器没有响应；请确认 egress-proxy-controller 已启动，且浏览器能访问它的 API 端口',
          [btn('重新连接', { variant: 'primary', icon: 'refresh', onClick: function () { refresh(); } }),
           btn('填写访问令牌', { icon: 'key', onClick: function () { promptToken(''); } })])));
      return;
    }
    var first = !ui.rendered[ui.tab];
    ui.rendered[ui.tab] = true;
    if (ui.tab === 'targets') renderTargetsView(sec, first);
    else if (ui.tab === 'matrix') renderMatrixView(sec, first);
    else renderStatusView(sec, first);
  }

  function emptyBlock(iconName, title, desc, actions) {
    var box = h('div', { class: 'empty' });
    box.appendChild(h('div', { class: 'empty-icon' }, icon(iconName, 18)));

  /* ------------------------------------------------------------------ *
   * 写操作                                                              *
   * ------------------------------------------------------------------ */
  function apiPayload(p) {
    var out = { name: p.name, namespaces: (p.namespaces || []).slice() };
    if (p.workload && p.workload.name) out.workload = { kind: p.workload.kind || 'Deployment', name: p.workload.name };
    var labels = p.matchLabels || {};
    if (Object.keys(labels).length) out.matchLabels = labels;
    else if (!out.workload) out.matchLabels = {};

  function applyPolicy(parts, successMsg) {
    var d = store.data;
    if (!d) return Promise.reject(new Error('尚未读取到控制器状态'));
    var body = {
      generation: d.generation,
      mode: validMode(d.modeRaw) ? d.modeRaw : d.mode,
      payloads: parts.payloads.map(apiPayload),
      targets: parts.targets.map(function (t) { return { host: t.host, port: t.port, proxyPort: t.proxyPort }; }),
      grants: parts.grants.map(function (g) { return { payload: g.payload, target: g.target }; })
    };
    return request('/api/v1/policy', { method: 'PUT', body: body })
      .then(function (res) {
        var gen = res && typeof res.generation === 'number' ? res.generation : null;
        if (store.data && gen !== null) store.data.generation = gen;
        toast('ok', successMsg + (gen !== null ? '（gen ' + gen + '）' : ''));
        closeModal();
        return refresh({ silent: true });
      })
      .catch(function (e) {
        handleActionError(e);
        throw e;
      });
  }

  function handleActionError(e) {

      return;
    }
    if (e && e.kind === 'auth') { promptToken('令牌无效或已过期，请重新填写'); return; }
    toast('err', (e && e.message) || '操作失败');
  }

  function toggleGrant(payloadName, key, cb) {
    var want = cb.checked;

    var row = cb.closest('.grant');
    if (row) row.setAttribute('aria-busy', 'true');
    request('/api/v1/grant', { method: 'POST', body: { payload: payloadName, target: key, allowed: want } })
      .then(function (res) {
        updateLocalGrant(payloadName, key, want);
        if (store.data && res && typeof res.generation === 'number') store.data.generation = res.generation;
        toast('ok', want ? (payloadName + ' 已获授权访问 ' + key + '（gen ' + (res && res.generation) + '）')
                        : ('已撤销 ' + payloadName + ' 对 ' + key + ' 的授权（gen ' + (res && res.generation) + '）'));

  function updateLocalGrant(payloadName, key, allowed) {

    if (allowed) grants.push({ payload: payloadName, target: key });
    store.data.grants = grants;

  /* ------------------------------------------------------------------ *

  function loadNamespaces(force) {
    var c = ui.cluster.ns;
    // 每次都向控制器重新确认：集群不可用时要能真正降级，而不是拿旧缓存撑场面
    var hadItems = c.status === 'ok' && c.items.length > 0;
    if (!force && c.status === 'loading') return Promise.resolve(c);
    if (!hadItems) c.status = 'loading';
    c.error = '';
    return request('/api/v1/cluster/namespaces').then(function (res) {
      var items = arr(res.namespaces).map(str).filter(Boolean);
      if (!items.length) throw new Error('命名空间列表为空');
      c.items = items.sort();
      c.status = 'ok';
      c.at = Date.now();
      return c;
    }).catch(function (e) {
      c.status = 'error';
      c.error = (e && e.message) || '读取命名空间失败';
      c.items = [];
      return c;
    });
  }

  function loadWorkloads(ns) {
    var w = ui.cluster.wl;
    w.status = 'loading';
    w.ns = ns;

  /* ------------------------------------------------------------------ *
   * 弹窗基础                                                            *
   * ------------------------------------------------------------------ */
  function focusables(root) {

    return Array.prototype.filter.call(root.querySelectorAll(sel), function (n) {
      return n.offsetParent !== null || n === document.activeElement;

  function openModal(spec) {
    closeModal(true);
    var last = document.activeElement;
    if (!last || last === document.body || last === document.documentElement) last = ui.lastTrigger;
    var scrim = h('div', { class: 'scrim' });
    var modal = h('div', {
      class: 'modal' + (spec.wide ? ' modal-wide' : ''),
      role: 'dialog',
      'aria-modal': 'true',
      'aria-labelledby': 'modal-title'
    });
    var head = h('div', { class: 'modal-head' });
    var headText = h('div', { class: 'modal-head-text' });
    headText.appendChild(h('h2', { class: 'modal-title', id: 'modal-title', text: spec.title }));
    if (spec.subtitle) headText.appendChild(h('p', { class: 'modal-sub', text: spec.subtitle }));
    head.appendChild(headText);
    head.appendChild(iconBtn('close', '关闭弹窗', { onClick: function () { closeModal(); }, fk: 'modal-close', cls: 'modal-x' }));
    modal.appendChild(head);

    var body = h('div', { class: 'modal-body' });
    appendKid(body, spec.body || []);
    modal.appendChild(body);

    if (spec.footer && spec.footer.length) {
      var foot = h('div', { class: 'modal-foot' });
      spec.footer.forEach(function (f) { foot.appendChild(f); });
      modal.appendChild(foot);
    }
    scrim.appendChild(modal);
    document.getElementById('modalRoot').appendChild(scrim);

    function onKey(e) {
      if (ui.popupOpen) return;   // 下拉展开时，Esc / Tab / 方向键交给下拉自己处理
      if (e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        closeModal();
        return;
      }
      if (e.key !== 'Tab') return;
      var f = focusables(modal);
      if (!f.length) { e.preventDefault(); return; }
      var first = f[0], lastEl = f[f.length - 1];
      if (!modal.contains(document.activeElement)) { e.preventDefault(); first.focus(); return; }
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); lastEl.focus(); }
      else if (!e.shiftKey && document.activeElement === lastEl) { e.preventDefault(); first.focus(); }
    }
    document.addEventListener('keydown', onKey, true);
    scrim.addEventListener('mousedown', function (e) { if (e.target === scrim) closeModal(); });

    ui.modal = { scrim: scrim, last: last, onKey: onKey, body: body };
    var focusTarget = spec.initialFocus || focusables(modal)[0];
    if (focusTarget) {
      setTimeout(function () {
        try {
          focusTarget.focus();
          if (focusTarget.select && focusTarget.type === 'text') focusTarget.select();
        } catch (e) { /* ignore */ }
      }, 0);
    }
    return { modal: modal, body: body };
  }

  function closeModal(silent) {
    var m = ui.modal;
    if (!m) return;
    if (openSelect) openSelect();   // 弹窗关闭时收起还开着的下拉，避免浮层残留在 body 上
    document.removeEventListener('keydown', m.onKey, true);
    if (m.scrim.parentNode) m.scrim.parentNode.removeChild(m.scrim);
    ui.modal = null;
    if (silent) return;
    var target = m.last;
    var fk = (target && target.dataset && target.dataset.fk) ? target.dataset.fk : null;
    if (target && document.contains(target) && typeof target.focus === 'function') {
      try { target.focus({ preventScroll: true }); return; } catch (e) { /* ignore */ }
    }
    if (fk) {
      var same = document.querySelector('[data-fk="' + fk.replace(/["\\]/g, '\\$&') + '"]');
      if (same) { try { same.focus({ preventScroll: true }); return; } catch (e) { /* ignore */ } }
      ui.pendingFocus = fk;   // 触发按钮会被下一次渲染替换，等渲染完成再归还焦点
    }
    var fallback = document.getElementById('btnRefresh');
    if (fallback) fallback.focus({ preventScroll: true });
  }

    } else if (next === 'disabled') {

  /* ------------------------------------------------------------------ *
   * 弹窗：外部服务新增/编辑                                             *

  function openTargetModal(editing) {
    if (!store.data) { toast('warn', '还没有读取到控制器状态'); return; }
    var d = store.data;
    var others = d.targets.filter(function (t) { return !editing || targetKey(t) !== targetKey(editing); });
    var v = {
      host: editing ? editing.host : '',
      port: editing ? String(editing.port) : '',
      proxyPort: editing ? String(editing.proxyPort) : suggestProxyPort()
    };

    var hostInput = h('input', { class: 'input mono', type: 'text', value: v.host, placeholder: 'a.example.com 或 10.0.0.8', autocomplete: 'off', spellcheck: 'false', 'data-fk': 'f-host' });
    var portInput = h('input', { class: 'input mono', type: 'text', inputmode: 'numeric', value: v.port, placeholder: '443', autocomplete: 'off', 'data-fk': 'f-port' });
    var proxyInput = h('input', { class: 'input mono', type: 'text', inputmode: 'numeric', value: v.proxyPort, placeholder: '20001', autocomplete: 'off', 'data-fk': 'f-proxy' });

    var hostErr = h('p', { class: 'field-err', hidden: true });
    var portErr = h('p', { class: 'field-err', hidden: true });
    var proxyErr = h('p', { class: 'field-err', hidden: true });

    [hostInput, portInput, proxyInput].forEach(function (inp, idx) {
      inp.addEventListener('input', function () { validate(false); });
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
      if (idx === 2) inp.setAttribute('aria-describedby', 'proxy-err');
    });
    hostInput.setAttribute('id', 'f-host');
    portInput.setAttribute('id', 'f-port');
    proxyInput.setAttribute('id', 'f-proxy');
    hostErr.setAttribute('id', 'host-err');
    portErr.setAttribute('id', 'port-err');
    proxyErr.setAttribute('id', 'proxy-err');
    hostInput.setAttribute('aria-describedby', 'host-err');
    portInput.setAttribute('aria-describedby', 'port-err');

    var body = [
      h('div', { class: 'field' },
        h('label', { class: 'field-label', text: '目标 host', for: 'f-host' }),
        hostInput,
        hostErr,
        h('p', { class: 'field-hint', text: '域名或 IPv4；四元组里它就是「目标域名/IP」，节点按 host:port 精确匹配' })),
      h('div', { class: 'field-row' },

          h('label', { class: 'field-label', text: '目标端口', for: 'f-port' }),
          portInput, portErr,
          h('p', { class: 'field-hint', text: '外部服务真实监听端口，1–65535' })),
        h('div', { class: 'field' },
          h('label', { class: 'field-label', text: '代理端口', for: 'f-proxy' }),
          proxyInput, proxyErr,
          h('p', { class: 'field-hint', text: '负载通过本机这个端口访问目标，必须全局唯一' })))
    ];

    function showErr(elm, text) {
      if (text) { elm.textContent = T(text); elm.hidden = false; } else { elm.textContent = ''; elm.hidden = true; }
    }

    function validate(quiet) {
      var errs = {};
      var host = hostInput.value.trim();
      if (!host) errs.host = '请填写目标域名或 IPv4';
      else if (!isHostName(host) && !isIPv4(host)) errs.host = '不是合法的域名或 IPv4 地址';
      var port = parsePort(portInput.value);
      if (!portInput.value.trim()) errs.port = '请填写目标端口';
      else if (!port) errs.port = '端口需为 1–65535 的整数';
      var proxy = parsePort(proxyInput.value);
      if (!proxyInput.value.trim()) errs.proxy = '请填写代理端口';
      else if (!proxy) errs.proxy = '端口需为 1–65535 的整数';
      else if (others.some(function (t) { return t.proxyPort === proxy; })) {
        var dup = others.filter(function (t) { return t.proxyPort === proxy; })[0];
        errs.proxy = '代理端口 ' + proxy + ' 已被 ' + targetKey(dup) + ' 使用，必须全局唯一';
      }
      if (host && port && others.some(function (t) { return t.host === host && t.port === port; })) {
        errs.host = 'host:port ' + host + ':' + port + ' 已存在';

      var nextTarget = { host: res.host, port: res.port, proxyPort: res.proxy };
      var nextKey = targetKey(nextTarget);
      var newTargets, newGrants;
      if (editing) {
        var oldKey = targetKey(editing);
        newTargets = d.targets.map(function (t) { return targetKey(t) === oldKey ? nextTarget : t; });
        newGrants = d.grants.map(function (g) { return g.target === oldKey ? { payload: g.payload, target: nextKey } : g; });
      } else {
        newTargets = d.targets.concat([nextTarget]);
        newGrants = d.grants.slice();
      }
      saveBtn.disabled = true;
      applyPolicy({ payloads: d.payloads, targets: newTargets, grants: newGrants },
        editing ? ('已更新 ' + nextKey) : ('已新增 ' + nextKey)).catch(function () {
          saveBtn.disabled = false;

    var saveBtn = btn(editing ? '保存修改' : '新增服务', { variant: 'primary', onClick: submit });

    openModal({
      title: editing ? '编辑外部服务' : '新增外部服务',
      subtitle: '目标域名/IP + 目标端口 + 代理端口，三者一旦确定就不要随意改动：负载侧引用的是代理端口',
      body: body,

      initialFocus: hostInput

  function suggestProxyPort() {
    var used = (store.data ? store.data.targets : []).map(function (t) { return t.proxyPort; });

    return String(p);
