# =============================================================================
# Kustomize entry point for egress-proxy — a real deployment only needs two
# files edited and one command run
#
#   1) deploy/config.yaml   runtime configuration (proxy.address + targets)
#                           → packed by the configMapGenerator below into a
#                             ConfigMap whose content is identical to the
#                             /etc/egress-proxy/config.yaml mounted in the Pod
#
#   2) deploy/kustomization.yaml (this file): image addresses → images below
#
#   After editing run: kubectl apply -k deploy/
#
#   (no Pod restart needed: both components poll the mounted file every
#    options.configInterval and hot-reload it)
#
# Other common commands:
#   kubectl kustomize deploy/     render only, no apply: confirm the final manifest
#   kubectl delete -k deploy/     reverse the deployment
#
# Background: native Kubernetes YAML has no variables/references (kubectl apply
#   -f only parses text), so "write configuration only once" relies on the
#   kustomize bundled with kubectl; the manifests under base/ stay independent of
#   any specific environment (image names are placeholders, the ConfigMap is
#   generated by this file)
#
# -----------------------------------------------------------------------------
# egress-proxy 的 Kustomize 入口 —— 实际部署只需改两个文件、跑一条命令
#
#   1) deploy/config.yaml   运行配置（proxy.address + targets）
#                           → 由下方 configMapGenerator 自动打包成 ConfigMap，
#                             内容与 Pod 内挂载的 /etc/egress-proxy/config.yaml 一致
#
#   2) deploy/kustomization.yaml（本文件）镜像地址 → 下方 images 段
#
#   改完后执行：kubectl apply -k deploy/
#
#   （无需重启 Pod：两个组件按 options.configInterval 轮询挂载文件热加载）
#
# 其他常用命令：
#   kubectl kustomize deploy/     只渲染不应用，确认最终生效的清单
#   kubectl delete -k deploy/     反向删除
#
# 背景：Kubernetes 原生 YAML 不支持变量/引用（kubectl apply -f 只做文本解析），
#       「配置只写一处」依赖 kubectl 自带的 kustomize；base/ 下的清单保持与具体
#       环境无关（镜像名是占位名，ConfigMap 由本文件生成）
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# -----------------------------------------------------------------------------
# Shared namespace: the base manifests already declare it explicitly, this makes
# the generated ConfigMap land in it too.
#
# 统一命名空间：base 清单里已显式声明，这里保证生成的 ConfigMap 也落在同一命名空间。
# -----------------------------------------------------------------------------
namespace: egress-proxy

resources:
  - base/00-namespace.yaml
  - base/10-daemonset.yaml
  - base/20-proxy-deployment.yaml
  - base/30-controller.yaml

# -----------------------------------------------------------------------------
# Runtime configuration → data["config.yaml"] of the ConfigMap.
#
# Without a "key=" prefix in files, the key is the file name (config.yaml), which
# is exactly the key the program reads.
#
# 运行配置 → ConfigMap 的 data["config.yaml"]。
#
# files 里没有 "key=" 前缀时，key 取文件名（config.yaml），正是程序读取的 key。
# -----------------------------------------------------------------------------
configMapGenerator:
  - name: egress-proxy-config
    files:
      - config.yaml
    options:
      # -----------------------------------------------------------------------
      # Fixed name: no content-hash suffix is appended, the DaemonSet/Deployment
      # reference it by name.
      #
      # 固定名字：不追加内容 hash 后缀，DaemonSet/Deployment 按名字引用它。
      # -----------------------------------------------------------------------
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/part-of: egress-proxy

# -----------------------------------------------------------------------------
# Image addresses: maintained only here (the base manifests use placeholder names).
#
# 镜像地址：只在这里维护（base 清单里是占位名）。
# -----------------------------------------------------------------------------
images:
  # ---------------------------------------------------------------------------
  # redirect-agent (DaemonSet, one per worker node).
  #
  # redirect-agent（DaemonSet，每工作节点一个）。
  # ---------------------------------------------------------------------------
  - name: redirect-agent
    newName: <harbor_domain>/egress-proxy/redirect-agent
    newTag: "0.1.6"

  # ---------------------------------------------------------------------------
  # tcp-forwarder (Deployment, one on the proxy node).
  #
  # tcp-forwarder（Deployment，代理节点上一个）。
  # ---------------------------------------------------------------------------
  - name: tcp-forwarder
    newName: <harbor_domain>/egress-proxy/tcp-forwarder
    newTag: "0.1.6"

  # ---------------------------------------------------------------------------
  # controller (Deployment, four-tuple policy control plane + WebUI).
  #
  # controller（Deployment，四元组策略控制面 + WebUI）。
  # ---------------------------------------------------------------------------
  - name: controller
    newName: <harbor_domain>/egress-proxy/controller
    newTag: "0.1.6"
